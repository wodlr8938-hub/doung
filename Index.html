            let bcHTML = '';
            historyStack.forEach((node, index) => {
                bcHTML += `<span class="cursor-pointer hover:underline ${index === historyStack.length - 1 ? 'font-bold text-[#1b3b22]' : ''}" onclick="goToBreadcrumb(${index})">${node.name}</span>`;
                if (index < historyStack.length - 1) {
                    bcHTML += `<span class="mx-2 text-gray-400">/</span>`;
                }
            });
            breadcrumb.innerHTML = bcHTML;

            let html = '';
            if (currentNode.type === 'article') {
                html = `
                    <div class="bg-white p-8 rounded-xl shadow-sm border border-[#e2ded4] animate-fadeIn">
                        <h2 class="text-3xl font-bold text-[#1b3b22] mb-4">${currentNode.name}</h2>
                        <p class="text-gray-500 mb-6 text-base">${currentNode.desc}</p>
                        <hr class="border-gray-100 mb-6">
                        <div class="text-gray-700 leading-relaxed text-lg space-y-4">
                            ${currentNode.content}
                        </div>
                        <div class="mt-8">
                            <button onclick="goBack()" class="bg-[#1b3b22] text-[#c5a059] px-6 py-2.5 rounded-lg font-medium hover:bg-opacity-90 transition">← 이전 목록으로</button>
                        </div>
                    </div>
                `;
            } else {
                html = `
                    <div class="mb-8">
                        <h2 class="text-3xl font-bold text-[#1b3b22] mb-2">${currentNode.name}</h2>
                        <p class="text-gray-600">${currentNode.desc || '항목을 선택하여 자세한 정보를 확인하세요.'}</p>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                `;
                for (let key in currentNode.children) {
                    let child = currentNode.children[key];
                    html += `
                        <div onclick="selectNode('${key}')" class="zelda-card p-6 rounded-xl cursor-pointer flex flex-col justify-between">
                            <div>
                                <span class="text-xs font-semibold px-2.5 py-1 rounded-full badge-gold inline-block mb-3">
                                    ${child.type === 'article' ? '상세 공략' : '하위 분류'}
                                </span>
                                <h3 class="text-xl font-bold text-gray-800 mb-2">${child.name}</h3>
                                <p class="text-gray-600 text-sm leading-relaxed">${child.desc}</p>
                            </div>
                            <div class="mt-6 flex items-center text-[#1b3b22] font-semibold text-sm">
                                <span>탐색하기</span>
                                <span class="ml-1">→</span>
                            </div>
                        </div>
                    `;
                }
                html += `</div>`;
            }
            container.innerHTML = html;
        }

        function selectNode(key) {
            const currentNode = getCurrentNode();
            if (currentNode.children && currentNode.children[key]) {
                historyStack.push(currentNode.children[key]);
                render();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function goBack() {
            if (historyStack.length > 1) {
                historyStack.pop();
                render();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function goHome() {
            historyStack = [database];
            render();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function goToBreadcrumb(index) {
            historyStack = historyStack.slice(0, index + 1);
            render();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        window.onload = function() {
            render();
        };
    </script>
</body>
</html>
